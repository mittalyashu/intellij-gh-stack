name: Junie issue

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created, edited]

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check if comment is from human
        if: github.event_name == 'issue_comment'
        run: |
          # Check if the commenter is a bot
          if [[ "${{ github.event.comment.user.type }}" == "Bot" ]]; then
            echo "Comment from bot, skipping..."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Comment from human, proceeding..."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        id: check_comment_author

      - uses: actions/checkout@v4
        if: steps.check_comment_author.outputs.skip != 'true'
        with:
          fetch-depth: 1

      - uses: JetBrains/junie-github-action@v1
        if: steps.check_comment_author.outputs.skip != 'true'
        with:
          junie_api_key: ${{ secrets.JUNIE_API_KEY }}
          use_single_comment: "true"
          attach_github_context_to_custom_prompt: "true"
