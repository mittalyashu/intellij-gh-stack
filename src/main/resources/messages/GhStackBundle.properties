tab.title=Stack
toolwindow.stripe.GH_Stack=GH Stack

panel.refresh=Refresh
panel.refresh.description=Reload the stack from gh stack.
panel.refresh.command=gh stack view --json
panel.add.branch=Add branch
panel.add.branch.description=Create a new branch on top of the stack.
panel.add.branch.command=gh stack add <branch>
panel.checkout=Checkout
panel.checkout.description=Check out this branch.
panel.checkout.command=gh stack checkout {0}
panel.rebase.from.here=Rebase stack from here
panel.rebase.from.here.description=Rebase this layer and the layers above it.
panel.rebase.from.here.command=gh stack rebase {0} --upstack
panel.all.stacks=All stacks
panel.all.stacks.description=Switch to another tracked stack.
panel.all.stacks.command=gh stack checkout <branch>
panel.init.stack=Initialize stack
panel.init.stack.description=Start a new stack from the current branch.
panel.init.stack.command=gh stack init <branch>
panel.rebase=Rebase stack
panel.rebase.description=Rebase the stack.
panel.rebase.command=gh stack rebase
panel.rebase.stack=Whole stack
panel.rebase.stack.description=Rebase the whole stack.
panel.rebase.stack.command=gh stack rebase
panel.rebase.upstack=Current branch to top
panel.rebase.upstack.description=Rebase the current branch and the layers above it.
panel.rebase.upstack.command=gh stack rebase --upstack
panel.rebase.downstack=Trunk to current branch
panel.rebase.downstack.description=Rebase the trunk and the layers below the current branch.
panel.rebase.downstack.command=gh stack rebase --downstack
panel.rebase.no.trunk=Without trunk
panel.rebase.no.trunk.description=Rebase the stack without the trunk.
panel.rebase.no.trunk.command=gh stack rebase --no-trunk
panel.rebase.continue=Continue rebase
panel.rebase.continue.description=Continue the paused stack rebase.
panel.rebase.continue.command=gh stack rebase --continue
panel.rebase.abort=Abort rebase
panel.rebase.abort.description=Abort the paused stack rebase and restore all branches.
panel.rebase.abort.command=gh stack rebase --abort

